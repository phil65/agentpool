keyPoints="0;0;1;1" keyTimes="0;0.2500;0.4700;1"><mpath href="#mmd-edge-1"/></animateMotion><animate attributeName="opacity" dur="4.60s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.2500;0.2700;0.4700;0.5100;1" values="0;0;1;1;0;0"/></circle><circle r="4" fill="#FBBF24"><animateMotion dur="4.60s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.7200;1"><mpath href="#mmd-edge-2"/></animateMotion><animate attributeName="opacity" dur="4.60s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.5000;0.5200;0.7200;0.7600;1" values="0;0;1;1;0;0"/></circle><circle r="4" fill="#34D399"><animateMotion dur="4.60s" begin="-0.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7500;0.9700;1"><mpath href="#mmd-edge-3"/></animateMotion><animate attributeName="opacity" dur="4.60s" begin="-0.40s" repeatCount="indefinite" keyTimes="0;0.7500;0.7700;0.9700;1.0000;1" values="0;0;1;1;0;0"/></circle></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i0"><text x="80.69" y="77.4" text-anchor="middle">session/prompt</text></g><g class="pele-edge-label" data-id="i1"><text x="239.41" y="114.4" text-anchor="middle">run_stream()</text></g><g class="pele-edge-label" data-id="i2"><text x="239.41" y="151.4" text-anchor="middle">tool_call + deltas</text></g><g class="pele-edge-label" data-id="i3"><text x="80.69" y="188.4" text-anchor="middle">session/update</text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="IDE"><rect x="-68.47" y="218" width="136.94" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="245.6" text-anchor="middle">Zed / VS Code</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="AP"><rect x="108.47" y="218" width="105.82" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pel