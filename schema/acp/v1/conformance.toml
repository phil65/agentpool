# Conformance of `acp.schema` against the pinned upstream schema (see VERSION).
#
# Checked by `uv run python -m acp.schema_reference check` and
# tests/acp/test_schema_reference.py. Every difference reported by the check must be
# listed under [known] with a reason; listed differences that no longer occur fail
# the check too, so remove them once fixed.

[renames]
# Upstream definition name = our name (models, unions and Literal aliases).
AgentNotification = "AgentNotificationMessage"
AgentRequest = "AgentRequestMessage"
ClientNotification = "ClientNotificationMessage"
ClientRequest = "ClientRequestMessage"
CompleteElicitationNotification = "ElicitationCompleteNotification"
CreateElicitationRequest = "ElicitationRequest"
CreateElicitationResponse = "ElicitationResponse"
McpServerStdio = "StdioMcpServer"
UnstructuredCommandInput = "CommandInputHint"
PermissionOptionKind = "PermissionKind"
StringFormat = "StringFormatLiteral"
ToolKind = "ToolCallKind"

[known]
# Finding id = reason.

# Modelled differently.
"missing-shape:ProxyNotification" = "proxy JSON-RPC envelopes are not modelled, only their params"
"missing-shape:ProxyRequest" = "proxy JSON-RPC envelopes are not modelled, only their params"
"missing-enum:Role" = "inlined as Literal['assistant', 'user'] in Audience"
"missing-enum:ElicitationSchemaType" = "inlined as Literal['object'] on ElicitationSchema.type"
"extra-enum-value:SessionConfigOptionCategory.other" = "harmless: upstream allows any string, the Literal also lists 'other'"
"extra-field:AgentNotification.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:AgentRequest.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:ClientNotification.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:ClientRequest.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:CompactionCapabilities._meta" = "harmless: every AnnotatedObject accepts _meta"
"extra-field:NoticeCapabilities._meta" = "harmless: every AnnotatedObject accepts _meta"
"extra-field:SessionCursorsCapabilities._meta" = "harmless: every AnnotatedObject accepts _meta"
